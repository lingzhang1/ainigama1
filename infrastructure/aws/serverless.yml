service: ainigama-backend

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    DEEPSEEK_API_KEY: ${env:DEEPSEEK_API_KEY}
    DYNAMODB_TABLE_CONNECTIONS: ${self:service}-${self:provider.stage}-connections
    DYNAMODB_TABLE_CONVERSATIONS: ${self:service}-${self:provider.stage}-conversations
    DYNAMODB_TABLE_MESSAGES: ${self:service}-${self:provider.stage}-messages
    DYNAMODB_TABLE_THREADS: ${self:service}-${self:provider.stage}-threads
    DYNAMODB_TABLE_QUESTIONS: ${self:service}-${self:provider.stage}-questions
    DYNAMODB_TABLE_ANSWERS: ${self:service}-${self:provider.stage}-answers
    DYNAMODB_TABLE_COMMENTS: ${self:service}-${self:provider.stage}-comments
    WEBSOCKET_ENDPOINT: 
      Fn::Join:
        - ''
        - - 'https://'
          - Ref: WebsocketsApi
          - '.execute-api.'
          - Ref: AWS::Region
          - '.amazonaws.com/'
          - ${self:provider.stage}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-*"
    - Effect: Allow
      Action:
        - execute-api:ManageConnections
      Resource:
        - "arn:aws:execute-api:*:*:**/@connections/*"

functions:
  # WebSocket Functions
  websocketConnect:
    handler: src/handlers/websocket.connect
    events:
      - websocket:
          route: $connect
  
  websocketDisconnect:
    handler: src/handlers/websocket.disconnect
    events:
      - websocket:
          route: $disconnect
  
  websocketDefault:
    handler: src/handlers/websocket.default
    events:
      - websocket:
          route: $default

  # Private Chat Functions
  chatStream:
    handler: src/handlers/privateChat.streamChat
    timeout: 30
    events:
      - http:
          path: /api/chat
          method: post
          cors: true

  # API Functions
  getThreads:
    handler: src/handlers/api.getThreads
    events:
      - http:
          path: /api/threads
          method: get
          cors: true

  getThread:
    handler: src/handlers/api.getThread
    events:
      - http:
          path: /api/threads/{threadId}
          method: get
          cors: true

  getUserConversations:
    handler: src/handlers/api.getUserConversations
    events:
      - http:
          path: /api/user-conversations/{userId}
          method: get
          cors: true

  getMessages:
    handler: src/handlers/api.getMessages
    events:
      - http:
          path: /api/messages/{conversationId}
          method: get
          cors: true

  createConversation:
    handler: src/handlers/api.createConversation
    events:
      - http:
          path: /api/new-conversation
          method: post
          cors: true

  updateConversationTitle:
    handler: src/handlers/api.updateConversationTitle
    events:
      - http:
          path: /api/conversations/{conversationId}/title
          method: put
          cors: true

  publishThread:
    handler: src/handlers/api.publishThread
    events:
      - http:
          path: /api/publish-thread
          method: post
          cors: true

  healthCheck:
    handler: src/handlers/api.healthCheck
    events:
      - http:
          path: /api/health
          method: get
          cors: true

resources:
  Resources:
    # WebSocket Connections Table
    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-connections
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Private Conversations Table
    ConversationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-conversations
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Messages Table
    MessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-messages
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: conversationId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Public Threads Table
    ThreadsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-threads
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Questions Table
    QuestionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-questions
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: threadId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Answers Table
    AnswersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-answers
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: questionId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Comments Table
    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-comments
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: answerId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

  Outputs:
    WebSocketURI:
      Description: "WebSocket URI"
      Value:
        Fn::Join:
          - ''
          - - 'wss://'
            - Ref: WebsocketsApi
            - '.execute-api.'
            - Ref: AWS::Region
            - '.amazonaws.com/'
            - ${self:provider.stage}

plugins:
  - serverless-offline