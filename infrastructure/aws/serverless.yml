service: ainigama-backend

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 30
  environment:
    DYNAMODB_TABLE_USERS: ${self:service}-${self:provider.stage}-users
    DYNAMODB_TABLE_CONVERSATIONS: ${self:service}-${self:provider.stage}-conversations
    DYNAMODB_TABLE_THREADS: ${self:service}-${self:provider.stage}-threads
    DYNAMODB_TABLE_MESSAGES: ${self:service}-${self:provider.stage}-messages
    DYNAMODB_TABLE_QUESTIONS: ${self:service}-${self:provider.stage}-questions
    DYNAMODB_TABLE_ANSWERS: ${self:service}-${self:provider.stage}-answers
    DYNAMODB_TABLE_COMMENTS: ${self:service}-${self:provider.stage}-comments
    DYNAMODB_TABLE_CONNECTIONS: ${self:service}-${self:provider.stage}-connections
    DYNAMODB_TABLE_THREAD_VIEWS: ${self:service}-${self:provider.stage}-thread-views
    DYNAMODB_TABLE_LIKES: ${self:service}-${self:provider.stage}-likes
    DYNAMODB_TABLE_SAVES: ${self:service}-${self:provider.stage}-saves
    DYNAMODB_TABLE_SHARES: ${self:service}-${self:provider.stage}-shares
    DYNAMODB_TABLE_NOTIFICATIONS: ${self:service}-${self:provider.stage}-notifications
    DYNAMODB_TABLE_USER_INTERACTIONS: ${self:service}-${self:provider.stage}-user-interactions
    DYNAMODB_TABLE_USER_PREFERENCES: ${self:service}-${self:provider.stage}-user-preferences
    DYNAMODB_TABLE_RECOMMENDATION_CACHE: ${self:service}-${self:provider.stage}-recommendation-cache
    DYNAMODB_TABLE_THREAD_METRICS_CACHE: ${self:service}-${self:provider.stage}-thread-metrics-cache
    DYNAMODB_TABLE_TIME_TRACKING: ${self:service}-${self:provider.stage}-time-tracking
    DEEPSEEK_API_KEY: ${env:DEEPSEEK_API_KEY, 'sk-0dcbd0d5eca74684919812e175de65b7'}
    NODE_ENV: ${self:provider.stage}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
    WEBSOCKET_ENDPOINT: 
      Fn::Join:
        - ""
        - - "https://"
          - Ref: WebsocketsApi
          - ".execute-api."
          - ${self:provider.region}
          - ".amazonaws.com/"
          - ${self:provider.stage}
  
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
        - dynamodb:BatchGetItem
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_USERS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_CONVERSATIONS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_CONVERSATIONS}/index/UserIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_THREADS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_THREADS}/index/PublicThreadsIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_MESSAGES}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_MESSAGES}/index/ConversationIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_QUESTIONS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_QUESTIONS}/index/ThreadIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_ANSWERS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_ANSWERS}/index/QuestionIdIndexV2"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_COMMENTS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_COMMENTS}/index/AnswerIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_CONNECTIONS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_THREAD_VIEWS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_LIKES}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_LIKES}/index/ContentTypeIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_LIKES}/index/UserIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_SAVES}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_SAVES}/index/ContentTypeIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_SAVES}/index/UserIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_SHARES}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_SHARES}/index/ContentTypeIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_CONNECTIONS}/index/UserIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_NOTIFICATIONS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_NOTIFICATIONS}/index/RecipientIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_NOTIFICATIONS}/index/RecipientIdReadIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_USER_INTERACTIONS}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_USER_INTERACTIONS}/index/UserIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_USER_INTERACTIONS}/index/ThreadIdIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_USER_PREFERENCES}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_RECOMMENDATION_CACHE}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_RECOMMENDATION_CACHE}/index/UserIdScoreIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_THREAD_METRICS_CACHE}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_THREAD_METRICS_CACHE}/index/TrendingScoreIndex"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_TIME_TRACKING}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_TIME_TRACKING}/index/UserIdIndex"

    - Effect: Allow
      Action:
        - execute-api:ManageConnections
      Resource:
        - "arn:aws:execute-api:${self:provider.region}:*:**/@connections/*"

functions:
  # Test endpoint to verify Lambda is working
  testHandler:
    handler: src/handlers/test.testHandler
    events:
      - http:
          path: /test
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: false
            maxAge: 86400
      - http:
          path: /test
          method: options
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: false
            maxAge: 86400

  # WebSocket API
  websocketConnect:
    handler: src/handlers/websocket.connect
    events:
      - websocket:
          route: $connect
  
  websocketDisconnect:
    handler: src/handlers/websocket.disconnect
    events:
      - websocket:
          route: $disconnect
  
  websocketDefault:
    handler: src/handlers/websocket.default
    events:
      - websocket:
          route: $default

  # Authentication handler
  websocketAuthenticate:
    handler: src/handlers/websocket.authenticate
    events:
      - websocket:
          route: authenticate

  # Notification subscription
  subscribeNotifications:
    handler: src/handlers/websocket.subscribeNotifications
    events:
      - websocket:
          route: subscribe_notifications

  # Private Chat API
  # Save conversation handler
  saveConversation:
    handler: src/handlers/privateChat.saveConversation
    events:
      - websocket:
          route: save_conversation

  # Public Thread API
  joinThread:
    handler: src/handlers/publicThread.joinThread
    events:
      - websocket:
          route: join_thread
  
  addAnswer:
    handler: src/handlers/publicThread.addAnswer
    events:
      - websocket:
          route: add_answer
  
  addComment:
    handler: src/handlers/publicThread.addComment
    events:
