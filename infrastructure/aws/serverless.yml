service: ainigama-backend

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    DEEPSEEK_API_KEY: ${env:DEEPSEEK_API_KEY}
    DYNAMODB_TABLE_CONVERSATIONS: ${self:service}-${self:provider.stage}-conversations
    DYNAMODB_TABLE_MESSAGES: ${self:service}-${self:provider.stage}-messages
    DYNAMODB_TABLE_THREADS: ${self:service}-${self:provider.stage}-threads
    DYNAMODB_TABLE_QUESTIONS: ${self:service}-${self:provider.stage}-questions
    DYNAMODB_TABLE_ANSWERS: ${self:service}-${self:provider.stage}-answers
    DYNAMODB_TABLE_COMMENTS: ${self:service}-${self:provider.stage}-comments
    DYNAMODB_TABLE_CONNECTIONS: ${self:service}-${self:provider.stage}-connections
    WEBSOCKET_ENDPOINT: !Sub "https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource:
        - !GetAtt ConversationsTable.Arn
        - !GetAtt MessagesTable.Arn
        - !GetAtt ThreadsTable.Arn
        - !GetAtt QuestionsTable.Arn
        - !GetAtt AnswersTable.Arn
        - !GetAtt CommentsTable.Arn
        - !GetAtt ConnectionsTable.Arn
        - !Sub "${MessagesTable.Arn}/index/*"
        - !Sub "${ThreadsTable.Arn}/index/*"
    - Effect: Allow
      Action:
        - execute-api:ManageConnections
      Resource:
        - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/*"

functions:
  # WebSocket Functions
  websocketConnect:
    handler: src/handlers/websocket.connect
    events:
      - websocket:
          route: $connect
  
  websocketDisconnect:
    handler: src/handlers/websocket.disconnect
    events:
      - websocket:
          route: $disconnect
  
  websocketDefault:
    handler: src/handlers/websocket.default
    events:
      - websocket:
          route: $default

  # Private Chat Functions
  sendMessage:
    handler: src/handlers/privateChat.sendMessage
    timeout: 30
    events:
      - websocket:
          route: send_message

  saveConversation:
    handler: src/handlers/privateChat.saveConversation
    events:
      - websocket:
          route: save_conversation

  # Public Thread Functions
  joinThread:
    handler: src/handlers/publicThread.joinThread
    events:
      - websocket:
          route: join_thread

  addAnswer:
    handler: src/handlers/publicThread.addAnswer
    events:
      - websocket:
          route: add_answer

  addComment:
    handler: src/handlers/publicThread.addComment
    events:
      - websocket:
          route: add_comment

  # REST API Functions
  getThreads:
    handler: src/handlers/api.getThreads
    events:
      - http:
          path: /threads
          method: get
          cors: true

  getThread:
    handler: src/handlers/api.getThread
    events:
      - http:
          path: /threads/{id}
          method: get
          cors: true

  getConversations:
    handler: src/handlers/api.getConversations
    events:
      - http:
          path: /users/{userId}/conversations
          method: get
          cors: true

  getMessages:
    handler: src/handlers/api.getMessages
    events:
      - http:
          path: /conversations/{conversationId}/messages
          method: get
          cors: true

  createConversation:
    handler: src/handlers/api.createConversation
    events:
      - http:
          path: /conversations
          method: post
          cors: true

  publishThread:
    handler: src/handlers/api.publishThread
    events:
      - http:
          path: /publish-thread
          method: post
          cors: true

resources:
  Resources:
    # DynamoDB Tables
    ConversationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_CONVERSATIONS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: updatedAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdUpdatedAtIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: updatedAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    MessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_MESSAGES}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: conversationId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ConversationIdTimestampIndexV2
            KeySchema:
              - AttributeName: conversationId
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    ThreadsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_THREADS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
          - AttributeName: updatedAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CreatedAtIndex
            KeySchema:
              - AttributeName: createdAt
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: UpdatedAtIndex
            KeySchema:
              - AttributeName: updatedAt
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    QuestionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_QUESTIONS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: threadId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ThreadIdIndex
            KeySchema:
              - AttributeName: threadId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    AnswersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_ANSWERS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: questionId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: QuestionIdIndex
            KeySchema:
              - AttributeName: questionId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_COMMENTS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: answerId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: AnswerIdIndex
            KeySchema:
              - AttributeName: answerId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_CONNECTIONS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH

  Outputs:
    WebSocketURI:
      Description: "WebSocket URI"
      Value: !Sub "wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"