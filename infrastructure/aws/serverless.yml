service: ainigama-backend
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    DEEPSEEK_API_KEY: ${env:DEEPSEEK_API_KEY}
    DYNAMODB_TABLE_CONVERSATIONS: ${self:service}-${self:provider.stage}-conversations
    DYNAMODB_TABLE_MESSAGES: ${self:service}-${self:provider.stage}-messages
    DYNAMODB_TABLE_THREADS: ${self:service}-${self:provider.stage}-threads
    DYNAMODB_TABLE_QUESTIONS: ${self:service}-${self:provider.stage}-questions
    DYNAMODB_TABLE_ANSWERS: ${self:service}-${self:provider.stage}-answers
    DYNAMODB_TABLE_COMMENTS: ${self:service}-${self:provider.stage}-comments
    DYNAMODB_TABLE_CONNECTIONS: ${self:service}-${self:provider.stage}-connections
    WEBSOCKET_ENDPOINT: !Sub 'https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}'
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt ConversationsTable.Arn
            - !GetAtt MessagesTable.Arn
            - !GetAtt ThreadsTable.Arn
            - !GetAtt QuestionsTable.Arn
            - !GetAtt AnswersTable.Arn
            - !GetAtt CommentsTable.Arn
            - !GetAtt ConnectionsTable.Arn
            - !Sub "${ConversationsTable.Arn}/index/*"
            - !Sub "${MessagesTable.Arn}/index/*"
            - !Sub "${ThreadsTable.Arn}/index/*"
            - !Sub "${QuestionsTable.Arn}/index/*"
            - !Sub "${AnswersTable.Arn}/index/*"
            - !Sub "${CommentsTable.Arn}/index/*"
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource:
            - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/*'

functions:
  # WebSocket handlers
  websocketConnect:
    handler: src/handlers/websocket.connect
    events:
      - websocket:
          route: $connect
  
  websocketDisconnect:
    handler: src/handlers/websocket.disconnect
    events:
      - websocket:
          route: $disconnect
  
  websocketDefault:
    handler: src/handlers/websocket.default
    events:
      - websocket:
          route: $default

  # Private chat handlers
  sendMessage:
    handler: src/handlers/privateChat.sendMessage
    timeout: 30
    events:
      - websocket:
          route: sendMessage

  saveConversation:
    handler: src/handlers/privateChat.saveConversation
    events:
      - websocket:
          route: saveConversation

  # Public thread handlers
  joinThread:
    handler: src/handlers/publicThread.joinThread
    events:
      - websocket:
          route: joinThread

  addAnswer:
    handler: src/handlers/publicThread.addAnswer
    events:
      - websocket:
          route: addAnswer

  addComment:
    handler: src/handlers/publicThread.addComment
    events:
      - websocket:
          route: addComment

  # REST API handlers
  getThreads:
    handler: src/handlers/api.getThreads
    events:
      - http:
          path: /threads
          method: get
          cors: true

  getThread:
    handler: src/handlers/api.getThread
    events:
      - http:
          path: /threads/{threadId}
          method: get
          cors: true

  getUserConversations:
    handler: src/handlers/api.getUserConversations
    events:
      - http:
          path: /users/{userId}/conversations
          method: get
          cors: true

  getConversationMessages:
    handler: src/handlers/api.getConversationMessages
    events:
      - http:
          path: /conversations/{conversationId}/messages
          method: get
          cors: true

  createConversation:
    handler: src/handlers/api.createConversation
    events:
      - http:
          path: /conversations
          method: post
          cors: true

  updateConversationTitle:
    handler: src/handlers/api.updateConversationTitle
    events:
      - http:
          path: /conversations/{conversationId}/title
          method: put
          cors: true

  publishThread:
    handler: src/handlers/api.publishThread
    events:
      - http:
          path: /publish-thread
          method: post
          cors: true

resources:
  Resources:
    # DynamoDB Tables
    ConversationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_CONVERSATIONS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: updatedAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: updatedAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    MessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_MESSAGES}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: conversationId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ConversationIdIndex
            KeySchema:
              - AttributeName: conversationId
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    ThreadsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_THREADS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
          - AttributeName: updatedAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CreatedAtIndex
            KeySchema:
              - AttributeName: createdAt
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: UpdatedAtIndex
            KeySchema:
              - AttributeName: updatedAt
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    QuestionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_QUESTIONS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: threadId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ThreadIdIndex
            KeySchema:
              - AttributeName: threadId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    AnswersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_ANSWERS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: questionId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: QuestionIdIndex
            KeySchema:
              - AttributeName: questionId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_COMMENTS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: answerId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: AnswerIdIndex
            KeySchema:
              - AttributeName: answerId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_CONNECTIONS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH

  Outputs:
    WebSocketURI:
      Description: "WebSocket URI"
      Value: !Sub "wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
    websocketPort: 3002