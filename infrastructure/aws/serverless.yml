service: ainigama-backend

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    DEEPSEEK_API_KEY: ${env:DEEPSEEK_API_KEY}
    DYNAMODB_TABLE_CONNECTIONS: ${self:service}-${self:provider.stage}-connections
    DYNAMODB_TABLE_CONVERSATIONS: ${self:service}-${self:provider.stage}-conversations
    DYNAMODB_TABLE_MESSAGES: ${self:service}-${self:provider.stage}-messages
    DYNAMODB_TABLE_THREADS: ${self:service}-${self:provider.stage}-threads
    DYNAMODB_TABLE_QUESTIONS: ${self:service}-${self:provider.stage}-questions
    DYNAMODB_TABLE_ANSWERS: ${self:service}-${self:provider.stage}-answers
    DYNAMODB_TABLE_COMMENTS: ${self:service}-${self:provider.stage}-comments
    WEBSOCKET_ENDPOINT: !Sub "https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource:
        - !GetAtt ConnectionsTable.Arn
        - !GetAtt ConversationsTable.Arn
        - !GetAtt MessagesTable.Arn
        - !GetAtt ThreadsTable.Arn
        - !GetAtt QuestionsTable.Arn
        - !GetAtt AnswersTable.Arn
        - !GetAtt CommentsTable.Arn
    - Effect: Allow
      Action:
        - execute-api:ManageConnections
      Resource:
        - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/*"

functions:
  # WebSocket Functions
  websocketConnect:
    handler: src/handlers/websocket.connect
    events:
      - websocket:
          route: $connect
  
  websocketDisconnect:
    handler: src/handlers/websocket.disconnect
    events:
      - websocket:
          route: $disconnect
  
  websocketDefault:
    handler: src/handlers/websocket.default
    events:
      - websocket:
          route: $default

  # Public Thread Functions
  joinThread:
    handler: src/handlers/publicThread.joinThread
    events:
      - websocket:
          route: join_thread
  
  addAnswer:
    handler: src/handlers/publicThread.addAnswer
    events:
      - websocket:
          route: add_answer
  
  addComment:
    handler: src/handlers/publicThread.addComment
    events:
      - websocket:
          route: add_comment

  # HTTP API Functions
  getThreads:
    handler: src/handlers/api.getThreads
    events:
      - http:
          path: /threads
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
  
  getThread:
    handler: src/handlers/api.getThread
    events:
      - http:
          path: /threads/{id}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
          cors: true
  
  getConversations:
    handler: src/handlers/api.getConversations
    events:
      - http:
          path: /users/{userId}/conversations
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
          cors: true
  
  getConversationMessages:
    handler: src/handlers/api.getConversationMessages
    events:
      - http:
          path: /conversations/{conversationId}/messages
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
          cors: true
  
  createConversation:
    handler: src/handlers/api.createConversation
    events:
      - http:
          path: /conversations
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
  # Additional API endpoints that were missing
  getUserConversations:
    handler: src/handlers/api.getUserConversations
    events:
      - http:
          path: /user-conversations/{userId}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

  createNewConversation:
    handler: src/handlers/api.createNewConversation
    events:
      - http:
          path: /new-conversation
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

  getMessages:
    handler: src/handlers/api.getMessages
    events:
      - http:
          path: /messages/{conversationId}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

  updateConversationTitle:
    handler: src/handlers/api.updateConversationTitle
    events:
      - http:
          path: /conversations/{conversationId}/title
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

  publishThread:
    handler: src/handlers/api.publishThread
    events:
      - http:
          path: /publish-thread
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

  chatStream:
    handler: src/handlers/api.chatStream
    timeout: 30
    events:
      - http:
          path: /chat
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

  generateTitle:
    handler: src/handlers/api.generateTitle
    events:
      - http:
          path: /generate-title
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

  healthCheck:
    handler: src/handlers/api.healthCheck
    events:
      - http:
          path: /health
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
          cors: true

resources:
  Resources:
    # WebSocket API
    WebsocketsApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: ${self:service}-${self:provider.stage}-websockets
        ProtocolType: WEBSOCKET
        RouteSelectionExpression: "$request.body.action"

    # DynamoDB Tables
    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-connections
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    ConversationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-conversations
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    MessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-messages
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    ThreadsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-threads
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    QuestionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-questions
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    AnswersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-answers
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-comments
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

  Outputs:
    WebSocketURI:
      Description: "WebSocket URI"
      Value: !Sub "wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"
    
    ApiGatewayRestApiId:
      Description: "API Gateway REST API ID"
      Value: !Ref ApiGatewayRestApi
    
    ApiGatewayRestApiRootResourceId:
      Description: "API Gateway REST API Root Resource ID"
      Value: !GetAtt ApiGatewayRestApi.RootResourceId

plugins:
  - serverless-offline